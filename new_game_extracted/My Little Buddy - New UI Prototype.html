<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Little Buddy — New UI Prototype</title>
<link rel="stylesheet" href="newui/style.css">
<style>
  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px);
    background: #1b1715; color: var(--cream-light); border: 3px solid #000;
    font-family: "Minecraft", monospace; font-size: 15px; padding: 12px 20px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 99;
    box-shadow: 0 6px 0 #00000055;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <nav class="rail">
    <div class="rail__brand">
      <h1>MY LITTLE BUDDY</h1>
      <p>NEW UI · INTERACTIVE PROTOTYPE</p>
    </div>
    <div id="railNav"></div>
    <div style="margin-top:auto;padding:14px 18px;border-top:2px solid #3a322e;color:#6f635c;font-size:10px;line-height:1.6">
      Pixel-art frames recreate the tilesets in <b style="color:#9a8b80">/new ui/</b>.<br>
      Words &amp; assets are pulled from the game's GDScript.<br>
      Click any button to feel the press + hear the click.
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h3 id="stageTitle">Opening Menu</h3>
      <span class="hint" id="stageMaps">→ MainMenu.tscn</span>
      <button class="toolbtn" id="soundBtn" data-on="true"><span class="swatch"></span><span>Sound On</span></button>
      <a class="toolbtn" href="Godot Implementation Guide.html" target="_blank">📋 Godot Guide</a>
    </div>
    <div class="stage" id="stage">
      <div class="scaler" id="scaler"></div>
    </div>
  </div>

  <script src="newui/prototype.js"></script>
</body>
</html>
